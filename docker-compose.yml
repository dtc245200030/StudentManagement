# HARDENING: Phân chia mạng cô lập (Network Isolation)
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge

services:
  # 1. Cơ sở dữ liệu MySQL
  db:
    image: mysql:8.0
    container_name: sms_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: StrongRootPassword123!
      MYSQL_DATABASE: student_mgmt
      MYSQL_USER: student_user
      MYSQL_PASSWORD: StrongUserPassword123!
    networks:
      - backend-net
    volumes:
      - db_data:/var/lib/mysql

  # 2. Quản lý DB bằng phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: sms_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_ABSOLUTE_URI: http://localhost/phpmyadmin/
    networks:
      - backend-net
      - frontend-net

  # 3. Web App Laravel (PHP-FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sms_laravel_app
    restart: always
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: student_mgmt
      DB_USERNAME: student_user
      DB_PASSWORD: StrongUserPassword123!
    volumes:
      - ./:/var/www/html
      - /var/www/html/vendor
    networks:
      - backend-net
      - frontend-net

  # 4. Nginx Reverse Proxy (Cổng vào duy nhất từ bên ngoài)
  nginx:
    image: nginx:alpine
    container_name: sms_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - frontend-net

  # 5. Prometheus (Hệ thống thu thập Metrics)[cite: 1, 2]
  prometheus:
    image: prom/prometheus:latest
    container_name: sms_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - frontend-net

  # 6. cAdvisor (Đo tài nguyên CPU/RAM của từng Container)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: sms_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - frontend-net

  # 7. Grafana (Trực quan hóa Dashboard Giám sát)[cite: 1, 2]
  grafana:
    image: grafana/grafana:latest
    container_name: sms_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend-net

  # 8. Loki (Hệ thống lưu trữ Log tập trung)[cite: 1, 2]
  loki:
    image: grafana/loki:2.9.0
    container_name: sms_loki
    ports:
      - "3100:3100"
    networks:
      - frontend-net

  # 9. Promtail (Gom log của Laravel gửi về Loki)
  promtail:
    image: grafana/promtail:2.9.0
    container_name: sms_promtail
    volumes:
      - /var/log:/var/log
      - ./storage/logs:/var/log/laravel
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - frontend-net

volumes:
  db_data:
